[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velib-api"
version = "0.1.0"
description = "API FastAPI d'inférence pour le modèle Vélib' fill rate predictor."
requires-python = ">=3.11"

# Dépendances minimales — réutilise shared/ et ml/ qui apportent le reste
# (xgboost, mlflow, pandas, etc. via leurs propres dépendances)
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",  # serveur ASGI + autoreload + websockets
    "pydantic>=2.5,<3.0",            # déjà via shared/, mais pin explicite
    "pydantic-settings>=2.0,<3.0",   # idem
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",              # client de tests pour FastAPI TestClient
]

[tool.setuptools.packages.find]
where = ["."]
include = ["velib_api*"]
