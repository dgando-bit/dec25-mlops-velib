global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Indique à Prometheus où trouver les fichiers de règles d'alerte
rule_files:
  - "rules/*.yml" # Charge tous les fichiers .yml dans le sous-répertoire 'rules'

scrape_configs:
  - job_name: velib-api
    static_configs:
      - targets: ['api:8000']
#    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']