<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Ressource introuvable · Vélib' MLOps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f7f8fa;
      color: #2d3748;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      padding: 3.5rem 4rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #f0faf0;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
      border-radius: 20px;
      padding: 0.3rem 1rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .badge::before { content: "🚲"; font-size: 0.9rem; }
    .code {
      font-size: 6rem;
      font-weight: 900;
      color: #e0e0e0;
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 0.75rem;
    }
    .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.75rem;
    }
    p {
      color: #718096;
      font-size: 0.92rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    code {
      background: #f4f6f8;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 0.1em 0.4em;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.85em;
      color: #5a67d8;
    }
    .links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      text-decoration: none;
      padding: 0.55rem 1.4rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.15s;
    }
    a:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-primary { background: #5bac3a; color: #fff; }
    .btn-secondary { background: #edf2f7; color: #4a5568; }
    .divider {
      border: none;
      border-top: 1px solid #edf2f7;
      margin: 0 0 1.5rem;
    }
    .footer { font-size: 0.72rem; color: #b0bec5; }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: #5bac3a;
      border-radius: 50%;
      margin-right: 0.3rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Vélib' MLOps</div>
    <div class="code">404</div>
    <div class="icon">🔍</div>
    <h1>Ressource introuvable</h1>
    <p>
      L'endpoint demandé n'existe pas sur cette API.<br>
      Vérifiez l'URL ou consultez la documentation pour la liste<br>
      des routes disponibles (<code>GET /docs</code>).
    </p>
    <div class="links">
      <a href="/docs" class="btn-primary">Documentation API</a>
      <a href="/health" class="btn-secondary">Status API</a>
    </div>
    <hr class="divider">
    <p class="footer">
      <span class="status-dot"></span>
      Vélib' MLOps · Nginx reverse proxy · HTTP 404 Not Found
    </p>
  </div>
</body>
</html>
