events {
    worker_connections 1024;
}

http {
    # ─── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=mllimit:10m rate=5r/s;
    limit_req_status 429;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # ─── Upstreams ────────────────────────────────────────────────────────────
    upstream api_backend {
        server api:8000;
    }

    upstream mlflow_backend {
        server mlflow-server:5000;
    }

    upstream jupyter_backend {
        server jupyter-service:8888;
    }

    upstream prometheus_backend {
        server prometheus:9090;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    upstream airflow_backend {
        server airflow-webserver:8080;
    }

    upstream flower_backend {
        server flower:5555;
    }

    upstream streamlit_backend {
        server streamlit:8501;
    }

    # ─── API FastAPI (port 80) ────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        error_page 404 /errors/404.html;
        error_page 429 /errors/429.html;
        error_page 500 502 503 504 /errors/50x.html;

        location ^~ /errors/ {
            root /etc/nginx;
            internal;
        }

        location / {
            limit_req zone=apilimit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_intercept_errors on;
        }
    }

    # ─── MLflow UI ────────────────────────────────────────────────────────────
    server {
        listen 5000;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            limit_req zone=mllimit burst=10 nodelay;
            proxy_pass http://mlflow_backend;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }
    }

    # ─── JupyterLab ───────────────────────────────────────────────────────────
    server {
        listen 8888;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            proxy_pass http://jupyter_backend;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_read_timeout 86400;
        }
    }

    # ─── Prometheus ───────────────────────────────────────────────────────────
    server {
        listen 9090;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            limit_req zone=mllimit burst=10 nodelay;
            proxy_pass http://prometheus_backend;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }
    }

    # ─── Grafana ──────────────────────────────────────────────────────────────
    server {
        listen 3000;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            proxy_pass http://grafana_backend;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
        }
    }

    # ─── Flower (monitoring Celery) ───────────────────────────────────────────
    server {
        listen 5555;
        server_name localhost;

        location / {
            limit_req zone=mllimit burst=10 nodelay;
            proxy_pass http://flower_backend;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
        }
    }

    # ─── Airflow UI (port 8090) ──────────────────────────────────────────────
    server {
        listen 8090;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            limit_req zone=mllimit burst=10 nodelay;
            proxy_pass http://airflow_backend;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port   $server_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
            proxy_buffering off;
        }
    }

    # ─── Streamlit (port 8501) ───────────────────────────────────────────────
    server {
        listen 8501;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            proxy_pass http://streamlit_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}