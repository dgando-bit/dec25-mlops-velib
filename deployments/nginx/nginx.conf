worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include          /etc/nginx/mime.types;
    default_type     application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 100M;
    server_tokens      off;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=mllimit:10m rate=5r/s;
    limit_req_status 429;

    # ─── DNS Docker interne — résolution lazy à la requête (pas au démarrage)
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ─── API FastAPI (port 80) ────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        error_page 404 /errors/404.html;
        error_page 429 /errors/429.html;
        error_page 500 502 503 504 /errors/50x.html;

        location ^~ /errors/ {
            root /etc/nginx;
            internal;
        }

        location / {
            set $upstream api:8000;
            limit_req zone=apilimit burst=20 nodelay;
            proxy_pass http://$upstream;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_intercept_errors on;
        }
    }

    # ─── MLflow UI (port 5000) ────────────────────────────────────────────────
    server {
        listen 5000;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            set $upstream mlflow-server:5000;
            limit_req zone=mllimit burst=10 nodelay;
            proxy_pass http://$upstream;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_read_timeout 300s;
        }
    }

    # ─── JupyterLab (port 8888) ───────────────────────────────────────────────
    server {
        listen 8888;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            set $upstream jupyter-service:8888;
            proxy_pass http://$upstream;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_read_timeout 86400;
        }
    }

    # ─── Prometheus (port 9090) ───────────────────────────────────────────────
    server {
        listen 9090;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            set $upstream prometheus:9090;
            limit_req zone=mllimit burst=10 nodelay;
            proxy_pass http://$upstream;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }
    }

    # ─── Grafana (port 3000) ──────────────────────────────────────────────────
    server {
        listen 3000;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            set $upstream grafana:3000;
            proxy_pass http://$upstream;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
        }
    }

    # ─── Flower / Celery monitoring (port 5555) ───────────────────────────────
    server {
        listen 5555;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            set $upstream flower:5555;
            limit_req zone=mllimit burst=10 nodelay;
            proxy_pass http://$upstream;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
        }
    }

    # ─── Airflow UI (port 8090) ───────────────────────────────────────────────
    server {
        listen 8090;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            set $upstream airflow-webserver:8080;
            limit_req zone=mllimit burst=10 nodelay;
            proxy_pass http://$upstream;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }

    # ─── Streamlit (port 8501) ────────────────────────────────────────────────
    server {
        listen 8501;
        server_name localhost;

        error_page 500 502 503 504 /errors/50x.html;
        location ^~ /errors/ { root /etc/nginx; internal; }

        location / {
            set $upstream streamlit:8501;
            proxy_pass http://$upstream;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
