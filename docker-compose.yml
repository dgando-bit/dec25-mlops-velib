x-airflow-common: &airflow-common
  build: # ← remplace image:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
#    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}       # ← depuis .env
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"                  # ← désactiver les exemples
#    AIRFLOW__API__AUTH_BACKEND: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__SMTP__SMTP_HOST: "smtp.gmail.com"
    AIRFLOW__SMTP__SMTP_PORT: 587
    AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW_SMTP_USER}         # ← depuis .env
    AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW_SMTP_PASSWORD} # ← depuis .env
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW_SMTP_USER}
    MLFLOW_TRACKING_URI: http://mlflow-server:5000         # ← accès MLflow depuis DAGs
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data:/app/data
    - ./ml:/app/ml
    - ./shared:/app/shared
    - ./mlflow/artifacts:/app/mlflow/artifacts
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  networks:
    - mlops-net
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

networks:
  mlops-net:
    driver: bridge

services:
  postgres:
    image: postgres:15
    container_name: dec25-mlops-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  redis:
    image: redis:latest
    container_name: dec25-mlops-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    networks:
      - mlops-net
    restart: always

  airflow-webserver:
    <<: *airflow-common
    container_name: dec25-mlops-airflow-webserver
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: dec25-mlops-airflow-scheduler
    command: scheduler
    restart: always

  airflow-worker:
    <<: *airflow-common
    container_name: dec25-mlops-airflow-worker
    command: celery worker
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: dec25-mlops-airflow-init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD}

  flower:
    <<: *airflow-common
    container_name: dec25-mlops-flower
    command: celery flower
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  # ─── Infrastructure ───────────────────────────────────────────────────────
  mlflow-db:
    image: postgres:15
#    container_name: dec25-mlops-mlflow-db
    env_file: .env
    environment:
      POSTGRES_DB: ${MLFLOW_DB}
      POSTGRES_USER: ${MLFLOW_USER}
      POSTGRES_PASSWORD: ${MLFLOW_PASSWORD}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_USER} -d ${MLFLOW_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow-server:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
#    container_name: dec25-mlops-mlflow-server
    env_file: .env
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${MLFLOW_USER}:${MLFLOW_PASSWORD}@mlflow-db/${MLFLOW_DB}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /app/mlflow/artifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    volumes:
      - ./mlflow/artifacts:/app/mlflow/artifacts
    networks:
      - mlops-net
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_USER}:${MLFLOW_PASSWORD}@mlflow-db/${MLFLOW_DB}
      --default-artifact-root /app/mlflow/artifacts

  # ─── ML ───────────────────────────────────────────────────────────────────
  ml_training:
    build:
      context: .
      dockerfile: ml/Dockerfile
      target: training
#    container_name: dec25-mlops-velib-ml
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      ML_MODEL_STAGE: ${ML_MODEL_STAGE:-staging}
    volumes:
      - ./ml:/app/ml
      - ./data:/app/data
      - ./shared:/app/shared
      - ./mlflow/artifacts:/app/mlflow/artifacts
      - ./dvc.yaml:/app/dvc.yaml
      - ./dvc.lock:/app/dvc.lock
      - ./.dvc:/app/.dvc
      - ./.git:/app/.git:ro
    networks:
      - mlops-net
    depends_on:
      - mlflow-server
    command: python ml/src/main.py

  jupyter-service:
    build:
      context: .
      dockerfile: ml/Dockerfile
      target: jupyter
#    container_name: dec25-mlops-jupyter
    env_file: .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./ml:/app/ml
      - ./shared:/app/shared
      - ./ml/notebooks:/app/notebooks
      - ./data:/app/data
    tmpfs:
      - /home/appuser/.local/share/jupyter/runtime:uid=1000,gid=1000
    user: "1000:1000"
    networks:
      - mlops-net
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --notebook-dir=/app
      --IdentityProvider.token=${JUPYTER_TOKEN}
      --ServerApp.disable_check_xsrf=True
    restart: unless-stopped

  # ─── API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
#    container_name: dec25-mlops-velib-api
    env_file:
      - .env
    depends_on:
      - mlflow-server
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      API_MODEL_STAGE: ${API_MODEL_STAGE:-production}
    volumes:
      - ./mlflow/artifacts:/app/mlflow/artifacts
      - ./shared:/app/shared
      - ./api:/app/api
    networks:
      - mlops-net
    command: uvicorn api.velib_api.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Monitoring ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
#    container_name: dec25-mlops-prometheus
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - api
    networks:
      - mlops-net

  grafana:
    image: grafana/grafana:latest
#    container_name: dec25-mlops-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - mlops-net
  
  node-exporter:
    image: prom/node-exporter:latest
#    container_name: dec25-mlops-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - mlops-net
    restart: unless-stopped

  # ─── Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    build:
      context: deployments/nginx/
      dockerfile: Dockerfile
#    container_name: dec25-mlops-nginx
    ports:
      - "80:80"
      - "443:443"
      - "${MLFLOW_PORT}:5000"    # MLflow
      - "8080:8080"              # ← Airflow webserver
      - "5555:5555"              # ← Flower (monitoring Celery)
      - "8888:8888"              # Jupyter
      - "9090:9090"              # Prometheus
      - "3000:3000"              # Grafana
      - "9100:9100"              # Node exporter
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro
      - ./deployments/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api
      - mlflow-server
      - jupyter-service
      - prometheus
      - grafana
      - airflow-webserver    # ← ajouté
      - flower               # ← ajouté
    networks:
      - mlops-net

volumes:
  mlflow_db_data:
  prometheus_data:
  grafana_data:
  postgres_db_data: