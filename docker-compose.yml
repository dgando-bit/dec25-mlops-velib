networks:
  mlops-net:
    driver: bridge

services:
  mlflow-db:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_DB: ${MLFLOW_DB}
      POSTGRES_USER: ${MLFLOW_USER}
      POSTGRES_PASSWORD: ${MLFLOW_PASSWORD}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_USER} -d ${MLFLOW_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow-server:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    env_file:
      - .env
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${MLFLOW_USER}:${MLFLOW_PASSWORD}@mlflow-db/${MLFLOW_DB}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /app/mlflow/artifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    volumes:
      - ./mlflow/artifacts:/app/mlflow/artifacts
    networks:
      - mlops-net
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_USER}:${MLFLOW_PASSWORD}@mlflow-db/${MLFLOW_DB}
      --default-artifact-root /app/mlflow/artifacts

  ml_training:
    build:
      context: .
      dockerfile: ml/Dockerfile
      target: training
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    volumes:
      - ./ml:/app/ml
      - ./data:/app/data
      - ./shared:/app/shared
      - ./mlflow/artifacts:/app/mlflow/artifacts
      - ./dvc.yaml:/app/dvc.yaml
      - ./dvc.lock:/app/dvc.lock
      - ./.dvc:/app/.dvc
      - ./.git:/app/.git:ro
    networks:
      - mlops-net
    depends_on:
      - mlflow-server
    command: python ml/src/main.py

  jupyter-service:
    build:
      context: .
      dockerfile: ml/Dockerfile
      target: jupyter
    env_file:
      - .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./ml:/app/ml
      - ./shared:/app/shared
      - ./ml/notebooks:/app/notebooks
      - ./data:/app/data
    user: "1000:1000"
    networks:
      - mlops-net
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --notebook-dir=/app
      --IdentityProvider.token=${JUPYTER_TOKEN}
      --ServerApp.disable_check_xsrf=True
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      - mlflow-server
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    volumes:
      - ./mlflow/artifacts:/app/mlflow/artifacts
    networks:
      - mlops-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - api
    networks:
      - mlops-net

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - mlops-net

  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_secret}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: deployments/airflow/
      dockerfile: Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_secret}@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme_in_production}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: Velib
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@velib.local
    command: version
    networks:
      - mlops-net

  airflow-webserver:
    build:
      context: deployments/airflow/
      dockerfile: Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_secret}@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme_in_production}
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:${AIRFLOW_PORT:-8090}
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
    volumes:
      - ./deployments/airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: airflow webserver
    networks:
      - mlops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    build:
      context: deployments/airflow/
      dockerfile: Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_secret}@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme_in_production}
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT}
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    volumes:
      - ./deployments/airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECT_ROOT}:${HOST_PROJECT_ROOT}
    group_add:
      - "${DOCKER_GID:-999}"
    command: airflow scheduler
    networks:
      - mlops-net
    restart: unless-stopped

  streamlit:
    build:
      context: streamlit/
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:8000
      NGINX_URL: http://nginx:80
      MLFLOW_URL: http://mlflow-server:5000
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      AIRFLOW_URL: http://airflow-webserver:8080
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECT_ROOT}:${HOST_PROJECT_ROOT}
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - mlops-net
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    build:
      context: deployments/nginx/
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "${MLFLOW_PORT}:5000"
      - "8888:8888"
      - "9090:9090"
      - "3000:3000"
      - "${AIRFLOW_PORT:-8090}:8090"
      - "${STREAMLIT_PORT:-8501}:8501"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/errors:/etc/nginx/errors:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro
      - ./deployments/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api
      - mlflow-server
      - jupyter-service
      - prometheus
      - grafana
      - airflow-webserver
      - streamlit
    networks:
      - mlops-net

volumes:
  mlflow_db_data:
  prometheus_data:
  grafana_data:
  airflow_db_data:
  airflow_logs: