networks:
  mlops-net:
    driver: bridge

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  mlflow-db:
    image: postgres:15
#    container_name: dec25-mlops-mlflow-db
    env_file: .env
    environment:
      POSTGRES_DB: ${MLFLOW_DB}
      POSTGRES_USER: ${MLFLOW_USER}
      POSTGRES_PASSWORD: ${MLFLOW_PASSWORD}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_USER} -d ${MLFLOW_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow-server:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
#    container_name: dec25-mlops-mlflow-server
    env_file: .env
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${MLFLOW_USER}:${MLFLOW_PASSWORD}@mlflow-db/${MLFLOW_DB}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /app/mlflow/artifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    volumes:
      - ./mlflow/artifacts:/app/mlflow/artifacts
    networks:
      - mlops-net
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_USER}:${MLFLOW_PASSWORD}@mlflow-db/${MLFLOW_DB}
      --default-artifact-root /app/mlflow/artifacts

  # ─── ML ───────────────────────────────────────────────────────────────────
  ml_training:
    build:
      context: .
      dockerfile: ml/Dockerfile
      target: training
#    container_name: dec25-mlops-velib-ml
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      ML_MODEL_STAGE: ${ML_MODEL_STAGE:-staging}
    volumes:
      - ./ml:/app/ml
      - ./data:/app/data
      - ./shared:/app/shared
      - ./mlflow/artifacts:/app/mlflow/artifacts
      - ./dvc.yaml:/app/dvc.yaml
      - ./dvc.lock:/app/dvc.lock
      - ./.dvc:/app/.dvc
      - ./.git:/app/.git:ro
    networks:
      - mlops-net
    depends_on:
      - mlflow-server
    command: python ml/src/main.py

  jupyter-service:
    build:
      context: .
      dockerfile: ml/Dockerfile
      target: jupyter
#    container_name: dec25-mlops-jupyter
    env_file: .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./ml:/app/ml
      - ./shared:/app/shared
      - ./ml/notebooks:/app/notebooks
      - ./data:/app/data
    tmpfs:
      - /home/appuser/.local/share/jupyter/runtime:uid=1000,gid=1000
    user: "1000:1000"
    networks:
      - mlops-net
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --notebook-dir=/app
      --IdentityProvider.token=${JUPYTER_TOKEN}
      --ServerApp.disable_check_xsrf=True
    restart: unless-stopped

  # ─── API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
#    container_name: dec25-mlops-velib-api
    env_file:
      - .env
    depends_on:
      - mlflow-server
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      API_MODEL_STAGE: ${API_MODEL_STAGE:-production}
    volumes:
      - ./mlflow/artifacts:/app/mlflow/artifacts
      - ./shared:/app/shared
      - ./api:/app/api
    networks:
      - mlops-net
    command: uvicorn api.velib_api.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Monitoring ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
#    container_name: dec25-mlops-prometheus
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - api
    networks:
      - mlops-net

  grafana:
    image: grafana/grafana:latest
#    container_name: dec25-mlops-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - mlops-net

  # ─── Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    build:
      context: deployments/nginx/
      dockerfile: Dockerfile
#    container_name: dec25-mlops-nginx
    ports:
      - "80:80"
      - "${MLFLOW_PORT}:5000"
      - "8888:8888"
      - "9090:9090"
      - "3000:3000"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro
      - ./deployments/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api
      - mlflow-server
      - jupyter-service
      - prometheus
      - grafana
    networks:
      - mlops-net

volumes:
  mlflow_db_data:
  prometheus_data:
  grafana_data: